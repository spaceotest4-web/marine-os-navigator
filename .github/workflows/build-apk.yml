name: Build debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Routing API keys come from GitHub repo secrets so they never live in the repo.
      # STADIA_API_KEY is enough (free account); GRAPHHOPPER_API_KEY is optional.
      - name: Write local.properties
        run: |
          echo "stadiaApiKey=${{ secrets.STADIA_API_KEY }}" >> local.properties
          echo "graphhopperApiKey=${{ secrets.GRAPHHOPPER_API_KEY }}" >> local.properties

      - name: Build
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ferrostar-poc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
