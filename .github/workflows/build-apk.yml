name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the APK to the 'latest' release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Routing API keys come from GitHub repo secrets so they never live in the repo.
      # STADIA_API_KEY is enough (free account); GRAPHHOPPER_API_KEY is optional.
      - name: Write local.properties
        run: |
          echo "stadiaApiKey=${{ secrets.STADIA_API_KEY }}" >> local.properties
          echo "graphhopperApiKey=${{ secrets.GRAPHHOPPER_API_KEY }}" >> local.properties

      - name: Build
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marine-os-navigator-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Stable public download URL for the website / in-app updater:
      # https://github.com/<owner>/<repo>/releases/download/latest/marine-os-navigator.apk
      - name: Publish to 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk marine-os-navigator.apk
          gh release create latest --title "Marine OS Navigator (latest)" --notes "Auto-built from the latest main commit." || true
          gh release upload latest marine-os-navigator.apk --clobber
